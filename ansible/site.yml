- hosts: onprem
  become: true
  roles:
    - { role: common,    tags: [common] }
    - { role: docker,    tags: [docker] }       # DB 컨테이너용으로 유지
    - { role: wireguard, tags: [wireguard] }    # wg0이 먼저 있어야 firewalld가 인터페이스를 trusted에 넣는다
    - { role: firewalld, tags: [firewalld] }
    - { role: db_stack,  tags: [db] }
    - { role: k3s,       tags: [k3s] }
    - { role: ecr_pull,  tags: [k3s, ecr] }     # ECR 토큰 Secret + 갱신 cron
    - { role: k8s_app,   tags: [k8s_app] }
    - { role: exporters, tags: [exporters] }
    - { role: backup,    tags: [backup] }
