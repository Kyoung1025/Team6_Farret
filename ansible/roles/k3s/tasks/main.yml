- name: k3s 버전 확인
  ansible.builtin.assert:
    that: k3s_version is defined and k3s_version | length > 0
    fail_msg: vars.yml에 k3s_version을 고정하세요

- name: k3s 설치 (한 번만)
  ansible.builtin.shell: >
    curl -sfL https://get.k3s.io |
    INSTALL_K3S_VERSION={{ k3s_version }} INSTALL_K3S_EXEC="server --disable traefik" sh -
  args:
    creates: /usr/local/bin/k3s

- name: .kube 폴더
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0700"

- name: kubeconfig 복사
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    mode: "0600"
  when: not ansible_check_mode   # 미리 보기 때는 k3s가 아직 없음

# sudo는 /usr/local/bin을 PATH에서 빼서 k3s는 전체 경로로 부른다
- name: 노드 Ready 대기
  ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready node --all --timeout=120s
  changed_when: false
  when: not ansible_check_mode
