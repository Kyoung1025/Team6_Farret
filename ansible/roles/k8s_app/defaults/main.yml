k8s_dir: "{{ app_home }}/k8s"
db_host: 10.10.0.2
pretix_url: http://pretix-demo-alb-807412016.ap-northeast-2.elb.amazonaws.com   # AWS 앱과 같은 값

# pretix.cfg (templates/pretix.cfg.j2)
pretix_instance_name: My Pretix Server
pretix_currency: KRW
pretix_django_secret: "{{ vault_django_secret }}"   # 바꾸면 로그인이 전부 풀림

pretix_data_size: 5Gi        # 지금 볼륨은 약 23MB
pretix_data_docker_volume: stack_pretix-data   # 전환 전 docker 볼륨 (migrate_data용)
pretix_cpu_limit: "1"        # 0.5면 시작 중 WORKER TIMEOUT 반복
pretix_mem_request: 512Mi    # docker pretix 실사용 약 580MiB
pretix_mem_limit: 2000Mi     # 1536Mi도 CPU 4개(워커 8개)에서 OOMKilled. 넘으면 pretix pod만 재시작 (DB 보호)

exporter_version: "1.3.0"    # 지금 compose의 nginx-prometheus-exporter
nginx_service_type: LoadBalancer   # 전환 뒤 값. ClusterIP로 두면 80이 닫힘
nginx_real_ip_from: [10.0.0.0/16, 10.42.0.0/16]   # ALB(VPC), svclb

# pretix.cfg [mail]. 비밀번호는 vault
pretix_mail:
  from: up041601@gmail.com
  host: smtp.gmail.com
  port: 587
  user: up041601@gmail.com
  password: "{{ vault_mail_password }}"
  tls: "on"
  ssl: "off"
pretix_redis_sessions: false   # AWS 앱과 같게. true면 로그인 세션을 redis에
