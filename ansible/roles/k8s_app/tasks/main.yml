# redis → pretix → nginx 순서 (nginx가 시작할 때 pretix를 찾음)

- name: k8s 폴더
  ansible.builtin.file:
    path: "{{ k8s_dir }}"
    state: directory
    owner: "{{ app_user }}"
    mode: "0750"

# 원본 pretix.cfg에서 host=db만 10.10.0.2로.
# pretix_url을 주면 url도 바꾸고 ALB 뒤라서 X-Forwarded-* 를 믿게 함 (원본 파일은 안 건드림)
- name: pretix.cfg 원본 읽기
  ansible.builtin.slurp:
    src: "{{ pretix_cfg_src }}"
  register: pretix_cfg_raw
  no_log: true
  tags: [nginx]

- name: k3s용 pretix.cfg 만들기
  ansible.builtin.set_fact:
    pretix_cfg_k8s: >-
      {{ (pretix_cfg_raw.content | b64decode
          | regex_replace('(?m)^host=db$', 'host=' ~ db_host))
         if not pretix_url else
         (pretix_cfg_raw.content | b64decode
          | regex_replace('(?m)^host=db$', 'host=' ~ db_host)
          | regex_replace('(?m)^trust_x_forwarded_(for|proto)\s*=.*\n?', '')
          | regex_replace('(?m)^url\s*=.*$', 'url=' ~ pretix_url ~ '\ntrust_x_forwarded_for=on\ntrust_x_forwarded_proto=on')) }}
  no_log: true
  tags: [nginx]

# nginx 헬스체크용 이름. url과 따로 관리하면 어긋나서 여기서 꺼냄
- name: pretix.cfg url의 호스트
  ansible.builtin.set_fact:
    pretix_host: "{{ pretix_cfg_k8s | regex_findall('(?m)^url\\s*=\\s*https?://([^/:\\s]+)') | first }}"
  tags: [nginx]

- name: pretix-cfg Secret 적용
  ansible.builtin.shell: >
    /usr/local/bin/k3s kubectl create secret generic pretix-cfg -n pretix
    --from-file=pretix.cfg=/dev/stdin --dry-run=client -o yaml
    | /usr/local/bin/k3s kubectl apply -f -
  args:
    stdin: "{{ pretix_cfg_k8s }}"
  register: pretix_cfg_secret
  changed_when: "'unchanged' not in pretix_cfg_secret.stdout"
  no_log: true

- name: redis, pretix 매니페스트 배치
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ k8s_dir }}/{{ item }}"
    owner: "{{ app_user }}"
    mode: "0640"
  loop: [redis.yaml, pretix.yaml]
  register: app_manifests

- name: redis, pretix 적용 (바뀐 파일만)
  ansible.builtin.command: "/usr/local/bin/k3s kubectl apply -f {{ k8s_dir }}/{{ item.item }}"
  loop: "{{ app_manifests.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.changed

- name: nginx 매니페스트 배치
  ansible.builtin.template:
    src: nginx.yaml.j2
    dest: "{{ k8s_dir }}/nginx.yaml"
    owner: "{{ app_user }}"
    mode: "0640"
  register: nginx_manifest
  tags: [nginx]

- name: nginx 적용 (바뀌었을 때만)
  ansible.builtin.command: "/usr/local/bin/k3s kubectl apply -f {{ k8s_dir }}/nginx.yaml"
  when: nginx_manifest.changed
  register: nginx_apply
  tags: [nginx]

# 처음 만들 때는 재시작 안 함. 설정이 바뀐 경우(configured)만
- name: pretix 재시작 (pretix.cfg가 바뀐 경우)
  ansible.builtin.command: /usr/local/bin/k3s kubectl -n pretix rollout restart deploy/pretix
  when: "'configured' in (pretix_cfg_secret.stdout | default(''))"

- name: nginx 재시작 (ConfigMap이 바뀐 경우)
  ansible.builtin.command: /usr/local/bin/k3s kubectl -n pretix rollout restart deploy/nginx
  when: nginx_apply is changed and 'configmap/nginx-conf configured' in nginx_apply.stdout
  tags: [nginx]

- name: redis, pretix 롤아웃 대기
  ansible.builtin.command: "/usr/local/bin/k3s kubectl -n pretix rollout status deploy/{{ item }} --timeout=180s"
  loop: [redis, pretix]
  changed_when: false

- name: nginx 롤아웃 대기
  ansible.builtin.command: /usr/local/bin/k3s kubectl -n pretix rollout status deploy/nginx --timeout=180s
  changed_when: false
  tags: [nginx]
