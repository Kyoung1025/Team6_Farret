# DB는 compose에 남김 (AWS 앱이 10.10.0.2:5432로 접속)
# role은 db만 올린다. legacy 서비스(redis, pretix, nginx, exporter)는 건드리지 않는다

- name: stack 폴더
  ansible.builtin.file:
    path: "{{ stack_dir }}"
    state: directory
    owner: root
    group: docker
    mode: "0755"

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ stack_dir }}/docker-compose.yml"
    owner: root
    group: docker
    mode: "0644"
  no_log: true   # DB 비밀번호가 들어감
  register: compose_file

- name: DB 기동 (compose가 바뀌었을 때만)
  ansible.builtin.command: docker compose up -d db
  args:
    chdir: "{{ stack_dir }}"
  when: compose_file.changed
